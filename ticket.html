<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNAC | Terminal Oficial de Movilidad</title>
    
    <!-- LIBRERÍAS EXTERNAS - MANTENIDAS AL 100% -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Share+Tech+Mono&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- FIREBASE COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root { --accent: #ffc107; --dark: #050505; --fire: #ff4500; --white-clean: #f8f9fa; }
        body, html { margin: 0; padding: 0; min-height: 100vh; background-color: var(--dark); font-family: 'Inter', sans-serif; color: #ffffff; overflow-x: hidden; user-select: none; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeInUp 0.8s ease-out forwards; }
        
        #scanning-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; backdrop-filter: blur(25px); }
        .hud-box { width: 320px; height: 320px; border: 2px solid rgba(255, 193, 7, 0.2); position: relative; border-radius: 40px; background: rgba(255,255,255,0.02); overflow: hidden; }
        .hud-line { position: absolute; width: 100%; height: 4px; background: var(--accent); top: 0; animation: scanLine 2.5s linear infinite; box-shadow: 0 0 30px var(--accent); }
        @keyframes scanLine { 0% { top: 0; } 100% { top: 100%; } }

        .main-wrapper { position: relative; z-index: 10; background: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 0.4) 0%, rgba(5, 5, 5, 1) 100%), url('https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&q=80&w=1920'); background-size: cover; background-position: center; background-attachment: fixed; min-height: 100vh; width: 100%; display: flex; flex-direction: column; }
        header { width: 100%; max-width: 1200px; padding: 30px 20px; z-index: 1000; margin: 0 auto; }
        
        .card-panorama { position: relative; overflow: hidden; border-radius: 35px; border: 1px solid rgba(255,255,255,0.1); height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; background-size: cover; background-position: center; transition: 0.4s; cursor: pointer; text-align: center; padding: 20px; }
        .card-panorama::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.7); z-index: 1; pointer-events: none; }
        .shift-title { position: relative; z-index: 2; font-family: 'Montserrat'; font-weight: 900; font-style: italic; font-size: 35px; text-transform: uppercase; }

        /* ESTILOS ENCUESTA */
        .vote-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 20px; transition: 0.3s; }
        .btn-vote-main { width: 100%; padding: 18px; border-radius: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; position: relative; overflow: hidden; background: white; color: black; transition: 0.4s; }
        .percent-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; transition: width 1.5s cubic-bezier(0.1, 0, 0.3, 1); z-index: 0; }
        .btn-vote-main span { position: relative; z-index: 10; }

        .input-tech { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,193,7,0.3); padding: 22px; border-radius: 20px; text-align: center; font-size: 26px; font-weight: 900; color: #fff; outline: none; }
        #globe-box, #globe-box-2, #3d-form, #3d-page { width: 100%; height: 220px; pointer-events: none; }
        .hidden-section { display: none !important; }
    </style>
</head>
<body>

    <!-- HUD DE CARGA -->
    <div id="scanning-overlay">
        <div class="hud-box">
            <div class="hud-line"></div>
            <div class="absolute inset-0 flex flex-col items-center justify-center p-8">
                <i class="fa-solid fa-satellite-dish text-6xl text-yellow-500/40 mb-6 animate-bounce"></i>
                <p id="loader-msg" class="font-mono text-[11px] tracking-[3px] text-yellow-500 uppercase font-black">INICIANDO CONEXIÓN...</p>
                <div class="mt-10 w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-yellow-500 w-0 transition-all duration-500"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-wrapper">
        <header class="flex justify-between items-center relative z-20 animate-fade-up">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-yellow-500 rounded flex items-center justify-center shadow-lg"><i class="fa-solid fa-bus text-black text-lg"></i></div>
                <div class="flex flex-col text-left leading-none uppercase">
                    <span class="text-[10px] font-black tracking-widest leading-none">UNAC</span>
                    <span class="text-[9px] text-yellow-500 font-bold">Movilidad</span>
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto px-6 py-8 w-full flex-grow z-20">
            
            <!-- PASO 1: LOGIN -->
            <div id="step-1" class="text-center animate-fade-up">
                <h1 class="text-5xl md:text-6xl font-black uppercase italic tracking-tighter mb-4 leading-none">Tickets <span class="text-yellow-500">Oficiales</span></h1>
                <div class="max-w-xs mx-auto space-y-6">
                    <input type="text" id="dniInput" class="input-tech" placeholder="INGRESE DNI" maxlength="8">
                    <button onclick="Core.startScan()" class="bg-yellow-500 text-black font-black p-5 rounded-2xl w-full uppercase tracking-widest hover:bg-white transition shadow-xl">Verificar Alumno</button>
                    <div id="globe-box"></div>
                </div>
            </div>

            <!-- PASO 1.5: ENCUESTA ANIMADA -->
            <div id="step-survey" class="hidden-section animate-fade-up">
                <div class="text-center mb-10">
                    <h2 class="text-4xl font-black uppercase italic italic">SISTEMA DE <span class="text-yellow-500">OPINIÓN</span></h2>
                    <p class="text-[10px] tracking-[4px] text-gray-500 uppercase font-bold">Selecciona tu formato preferido</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                    <!-- OPCION FORMULARIO -->
                    <div class="vote-box flex flex-col items-center">
                        <span class="text-xl font-black uppercase tracking-tighter text-white">FORMULARIO</span>
                        <div id="3d-form"></div>
                        <button id="btn-v-formulario" onclick="Core.castVote('formulario')" class="btn-vote-main">
                            <div id="fill-formulario" class="percent-fill"></div>
                            <span id="txt-formulario">VOTAR AQUÍ</span>
                        </button>
                    </div>

                    <!-- OPCION PAGINA -->
                    <div class="vote-box flex flex-col items-center">
                        <span class="text-xl font-black uppercase tracking-tighter text-white">PÁGINA</span>
                        <div id="3d-page"></div>
                        <button id="btn-v-pagina" onclick="Core.castVote('pagina')" class="btn-vote-main">
                            <div id="fill-pagina" class="percent-fill"></div>
                            <span id="txt-pagina">VOTAR AQUÍ</span>
                        </button>
                    </div>
                </div>
                
                <p id="msg-final-voto" class="text-center mt-10 text-green-500 font-black uppercase text-[11px] tracking-[3px] hidden animate-pulse">
                    <i class="fa-solid fa-circle-check"></i> Su voto fue contado con éxito. Redirigiendo...
                </p>
            </div>

            <!-- PASO 2: SELECCIÓN DE TURNO -->
            <div id="step-2" class="hidden-section animate-fade-up">
                <div class="bg-white/5 border border-white/10 p-8 rounded-[40px] mb-8 border-l-8 border-l-yellow-500 flex flex-col md:flex-row justify-between items-center gap-8">
                    <div class="flex items-center gap-6">
                        <div class="w-24 h-24 bg-yellow-500 rounded-[30px] flex items-center justify-center text-black text-5xl shadow-2xl"><i class="fa-solid fa-user-check"></i></div>
                        <div>
                            <h2 id="userName" class="text-3xl font-black uppercase italic"></h2>
                            <p id="userFac" class="text-yellow-500 text-[11px] font-black mt-3 uppercase"></p>
                        </div>
                    </div>
                    <div class="text-center md:text-right bg-black/40 p-5 rounded-3xl border border-white/5 min-w-[200px]">
                        <p class="text-[9px] text-gray-500 font-black uppercase mb-1 tracking-widest">Sincronización Hoy</p>
                        <div class="text-4xl font-black text-yellow-500" id="total-requests">00</div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div id="card-m" class="card-panorama" style="background-image: url('DSC07555-768x432.jpg');" onclick="Core.requestTicket('mañana')">
                        <h3 class="shift-title">Mañana</h3>
                    </div>
                    <div id="card-t" class="card-panorama" style="background-image: url('DSC07588-768x432.jpg');" onclick="Core.goToTarde()">
                        <h3 class="shift-title">Tarde</h3>
                    </div>
                </div>
                <div id="globe-box-2"></div>
            </div>

            <!-- PASO 3: TICKET -->
            <div id="step-3" class="hidden-section animate-fade-up">
                <!-- Estructura del ticket original mantenida -->
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBxaeAc2nq7iEeiLejvja3lKGwR4E09QS4",
            authDomain: "ventanilla-unac.firebaseapp.com",
            databaseURL: "https://ventanilla-unac-default-rtdb.firebaseio.com",
            projectId: "ventanilla-unac",
            storageBucket: "ventanilla-unac.appspot.com",
            messagingSenderId: "245380540222",
            appId: "1:245380540222:web:d4ea08b7818bf89d682e6f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const Core = {
            alumno: null,
            dni: null,
            hasVoted: false,

            init: function() { this.initThree('globe-box', null); },

            startScan: async function() {
                const dni = document.getElementById('dniInput').value.trim();
                if(dni.length < 8) return Swal.fire('Error', 'DNI incompleto', 'warning');
                this.dni = dni;

                const overlay = document.getElementById('scanning-overlay'), bar = document.getElementById('progress-bar');
                overlay.style.display = 'flex';
                bar.style.width = '100%';
                
                await new Promise(r => setTimeout(r, 2000));

                db.ref('alumnos/' + dni).once('value').then(snap => {
                    overlay.style.display = 'none';
                    if(snap.exists()){
                        this.alumno = snap.val();
                        this.checkSurveyStatus();
                    } else {
                        Swal.fire('Error', 'No registrado', 'error');
                    }
                });
            },

            checkSurveyStatus: async function() {
                const snap = await db.ref('encuesta/votos/' + this.dni).once('value');
                document.getElementById('step-1').classList.add('hidden-section');
                document.getElementById('step-survey').classList.remove('hidden-section');
                
                // Iniciar 3D de imágenes
                this.initThree('3d-form', 'we1234.jpeg');
                this.initThree('3d-page', 'we12345.jpeg');

                if(snap.exists()) {
                    this.hasVoted = true;
                    this.showResults(snap.val().opcion);
                    document.getElementById('msg-final-voto').classList.remove('hidden');
                    setTimeout(() => this.showStep2(), 3500);
                }
            },

            castVote: async function(opcion) {
                if(this.hasVoted) return;
                this.hasVoted = true;

                // Registrar voto individual y sumar al contador global en Firebase
                await db.ref('encuesta/votos/' + this.dni).set({ opcion: opcion, fecha: Date.now() });
                await db.ref('encuesta/totales/' + opcion).transaction(c => (c || 0) + 1);

                this.showResults(opcion);
                document.getElementById('msg-final-voto').classList.remove('hidden');
                setTimeout(() => this.showStep2(), 3000);
            },

            showResults: async function(votoUsuario) {
                const snap = await db.ref('encuesta/totales').once('value');
                const t = snap.val() || { formulario: 0, pagina: 0 };
                const total = (t.formulario || 0) + (t.pagina || 0);
                
                const pForm = total === 0 ? 0 : Math.round((t.formulario / total) * 100);
                const pPag = total === 0 ? 0 : Math.round((t.pagina / total) * 100);

                // Formulario
                const bForm = document.getElementById('btn-v-formulario');
                const fForm = document.getElementById('fill-formulario');
                bForm.style.background = (votoUsuario === 'formulario') ? '#10b981' : '#ef4444';
                bForm.style.color = 'white';
                fForm.style.width = pForm + "%";
                fForm.style.background = 'rgba(0,0,0,0.2)';
                document.getElementById('txt-formulario').innerText = pForm + "% COMPLETADO";

                // Página
                const bPag = document.getElementById('btn-v-pagina');
                const fPag = document.getElementById('fill-pagina');
                bPag.style.background = (votoUsuario === 'pagina') ? '#10b981' : '#ef4444';
                bPag.style.color = 'white';
                fPag.style.width = pPag + "%";
                fPag.style.background = 'rgba(0,0,0,0.2)';
                document.getElementById('txt-pagina').innerText = pPag + "% COMPLETADO";
            },

            showStep2: function() {
                document.getElementById('step-survey').classList.add('hidden-section');
                document.getElementById('step-2').classList.remove('hidden-section');
                document.getElementById('userName').innerText = this.alumno.Estudiante;
                document.getElementById('userFac').innerText = this.alumno.Facultad;
                this.initThree('globe-box-2', null);
            },

            initThree: function(id, imgUrl) {
                const container = document.getElementById(id);
                if(!container) return;
                container.innerHTML = "";
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(container.clientWidth, container.clientHeight);
                container.appendChild(renderer.domElement);

                let obj;
                if(!imgUrl) {
                    obj = new THREE.Mesh(new THREE.IcosahedronGeometry(25, 2), new THREE.MeshBasicMaterial({ color: 0xffc107, wireframe: true, transparent: true, opacity: 0.15 }));
                } else {
                    const texture = new THREE.TextureLoader().load(imgUrl);
                    obj = new THREE.Mesh(new THREE.BoxGeometry(35, 35, 5), new THREE.MeshBasicMaterial({ map: texture }));
                }
                
                scene.add(obj);
                camera.position.z = 80;
                const animate = () => { 
                    requestAnimationFrame(animate); 
                    obj.rotation.y += 0.02; 
                    renderer.render(scene, camera); 
                };
                animate();
            }
        };

        window.onload = () => Core.init();
    </script>
</body>
</html>
